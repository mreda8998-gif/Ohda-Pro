<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>عهدة</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#14325c"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#1b2430;--mu:#6b7785;--pr:#14325c;--ln:#e3e8ee;--bad:#c0392b;--ok:#15803d;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151b;--card:#1a222c;--tx:#e8edf2;--mu:#93a1b0;--pr:#e07b12;--ln:#2a3542;--bad:#ff7b6b;--ok:#4ade80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10151b;--card:#1a222c;--tx:#e8edf2;--mu:#93a1b0;--pr:#e07b12;--ln:#2a3542;--bad:#ff7b6b;--ok:#4ade80;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;padding-bottom:76px}
main{max-width:640px;margin:0 auto;padding:12px}
h2{font-size:18px;margin:6px 0 10px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--ln)}
.row:last-child{border:0}
.mu{color:var(--mu);font-size:13px}.b{font-weight:700}.bad{color:var(--bad)}.ok{color:var(--ok)}
input,select{width:100%;padding:10px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;margin-bottom:8px}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--pr);color:#fff;font-weight:700;cursor:pointer}
button.g{background:transparent;color:var(--bad);padding:4px 8px}
button.s{background:var(--bg);color:var(--tx);border:1px solid var(--ln)}
.chips{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto}.chips button{white-space:nowrap}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;background:none;color:var(--mu);border-radius:0;padding:10px 2px;font-size:13px}
.tabs button.on{color:var(--pr)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.big{font-size:20px;font-weight:700}
h3{font-size:14px;margin:10px 0 6px;color:var(--mu)}input[type=checkbox]{width:auto;margin:0}label.chk{display:flex;align-items:center;gap:8px;margin-bottom:8px}button.edit{background:transparent;color:var(--pr);padding:4px 8px;border:1px solid var(--pr)}
.tabs button{font-size:11px;padding:8px 0}@media print{.tabs,button,select,.noprint{display:none!important}body{padding:0}}
table{width:100%;border-collapse:collapse}th,td{padding:8px 6px;border-bottom:1px solid var(--ln);text-align:right}th{color:var(--mu);font-size:13px}td.n,th.n{text-align:left}tr.t td{font-weight:700;background:var(--bg)}
.gr{overflow-x:auto;margin-bottom:8px}.gr table{width:auto;min-width:max-content}.gr th,.gr td{padding:3px;text-align:center;border:1px solid var(--ln);font-size:13px}.gr .l{position:sticky;right:0;background:var(--card);font-weight:700;min-width:62px;z-index:1}.gr input{width:60px;margin:0;padding:6px 2px;text-align:center}.gr button.cy{width:44px;padding:6px 0;background:var(--bg);color:var(--tx);border:1px solid var(--ln)}input.pi{width:70px;margin:0;padding:5px;text-align:center}
</style>
</head>
<body>
<main id="app"></main>
<nav class="tabs" id="tabs"></nav>
<script>
let SITES=['العاصمة','أكتوبر','السوق'];
const TABS=[['sum','📊','الملخص'],['c','💰','العهدة'],['w','👷','المواقع'],['o','🧾','مصروفات'],['p','🤝','تصفيات'],['m','📒','مديونيات'],['ms','📑','مستخلصات']];
const SUB={o:['x','z']};
const D=['date','التاريخ','date'],A=['amount','المبلغ','number'];
const L={c:{t:'العهدة',f:[D,A,['r','المستلم','text']],s:x=>f(x.amount)+' · '+esc(x.r)},
 x:{t:'نثريات',f:[D,['d','البيان','text'],A],s:x=>f(x.amount)+' · '+esc(x.d)},
 z:{t:'زيد السوق',f:[D,['k','النوع','select',['مصاريف','سلف']],A,['n','ملاحظة','text']],s:x=>x.k+': '+f(x.amount)+' '+esc(x.n)},
 p:{t:'تصفيات',f:[D,['name','الاسم','list'],A,['s','الموقع','select','SITES'],['n','ملاحظات','text']],s:x=>esc(x.name)+': '+f(x.amount)+' ('+x.s+') '+esc(x.n)},
 m:{t:'مديونيات',f:[D,['name','الاسم','list'],A],s:x=>esc(x.name)+': '+f(x.amount)}};
let S;try{S=JSON.parse(localStorage.getItem('ohda2'))}catch(e){}
S=Object.assign({c:[],x:[],z:[],p:[],m:[],w:[],e:[],sf:[],se:[],ms:[]},S||{});
S.sites=S.sites||SITES.slice();SITES=S.sites;
S.w.forEach(w=>{w.meterRate=w.meterRate||0;w.helperRate=w.helperRate||0;w.prev=w.prev||{days:0,ot:0,exp:0,meterQty:0}});
const today=()=>new Date().toISOString().slice(0,10);
let openStmt=null,openMs=null,MOD=0;let tab='sum',site=SITES[0],openW=null,mon=today().slice(0,7),sub={o:'x',q:'p'},selW=new Set(),multiPrint=false;
function toast(m){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:#15803d;color:#fff;padding:8px 16px;border-radius:20px;z-index:9998;font-weight:700;pointer-events:none';document.body.appendChild(t)}t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',1300)}
const save=()=>{try{localStorage.setItem('ohda2',JSON.stringify(S))}catch(e){}syncSoon();toast('✅ تم الحفظ')};
const $=s=>document.querySelector(s);
const sum=(a,k='amount')=>a.reduce((t,y)=>t+(+y[k]||0),0);
const f=n=>(+n||0).toLocaleString('en-US');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cls=n=>n<0?'bad':'ok';
const inM=d=>mon=='all'||(d||'').slice(0,7)==mon,bef=d=>mon!='all'&&(d||'')<mon;
const M=a=>a.filter(x=>inM(x.date));
const earn=(e,w)=>(+e.days||0)*(e.rt!=null?+e.rt:+w.rt||0)+(+e.ot||0)*(e.otRate!=null?+e.otRate:+w.ot||0)+(+e.q||0)*(+e.r||0);
const ded=e=>(+e.x||0)+(+e.a||0)+(+e.g||0);
function acct(w){
 const sc=d=>!w.since||(d||'')>=w.since,E=S.e.filter(e=>e.w==w.id&&sc(e.date)),pr=w.prev||{},hr=+w.helperRate||0,PS=S.p.filter(p=>p.name==w.n&&sc(p.date));
 const rt=e=>+w.rt||0,ot=e=>+w.ot||0;
 const agg=L=>({days:sum(L,'days'),ot:sum(L,'ot'),q:sum(L,'q'),x:sum(L,'x'),a:sum(L,'a'),g:sum(L,'g'),hd:L.reduce((t,e)=>t+(+e.hd||(e.helper?1:0)),0),dA:L.reduce((t,e)=>t+(+e.days||0)*rt(e),0),oA:L.reduce((t,e)=>t+(+e.ot||0)*ot(e),0),mA:L.reduce((t,e)=>t+(+e.q||0)*(+e.r||0),0)});
 const A=agg(E.filter(e=>bef(e.date))),C=agg(E.filter(e=>inM(e.date))),M={days:+pr.days||0,ot:+pr.ot||0,q:+pr.meterQty||0,x:+pr.exp||0,a:+pr.adv||0,g:0,hd:+pr.hd||0};
 M.dA=M.days*(+w.rt||0);M.oA=M.ot*(+w.ot||0);M.mA=M.q*(+w.meterRate||0);
 const P={},T={};for(const k in C){P[k]=A[k]+M[k];T[k]=P[k]+C[k]}
 const e=o=>o.dA+o.oA+o.mA,d=o=>o.x+o.a+o.g+o.hd*hr;
 return{P,C,T,A,M,hr,E,paidP:sum(PS.filter(p=>bef(p.date))),paidC:sum(PS.filter(p=>inM(p.date))),earnP:e(P),earnC:e(C),earnT:e(T),dedP:d(P),dedC:d(C),dedT:d(T)}}
function wst(w){const a=acct(w),r={prev:a.earnP-a.dedP-a.paidP,earn:a.earnC,x:a.C.x,a:a.C.a,g:a.C.g,helperDays:a.C.hd,helperCost:a.C.hd*a.hr,paid:a.paidC,days:a.C.days,ot:a.C.ot,meter:a.C.q,debt:sum(S.m.filter(m=>m.name==w.n))};
 r.bal=r.prev+r.earn-r.x-r.a-r.g-r.helperCost-r.paid;return r}
function rr(){const xs=[...document.querySelectorAll('.keepx')].map(e=>e.scrollLeft),sy=scrollY;render();document.querySelectorAll('.keepx').forEach((e,i)=>e.scrollLeft=xs[i]||0);scrollTo(0,sy)}
async function del(c,id){if(!await sure('متأكد من الحذف؟'))return;S[c]=S[c].filter(x=>x.id!=id);save();render()}
function go(t){tab=t;openW=null;openStmt=null;openMs=null;multiPrint=false;render();scrollTo(0,0)}
const siteIds=s=>S.w.filter(w=>w.s==s).map(w=>w.id);
const getSiteIn=s=>sum(S.sf.filter(x=>x.site==s&&inM(x.date)));
const getSiteOut=s=>sum(S.se.filter(x=>x.site==s&&inM(x.date)));
const getWX=s=>sum(S.e.filter(e=>siteIds(s).includes(e.w)&&inM(e.date)),'x');
const getWA=s=>sum(S.e.filter(e=>siteIds(s).includes(e.w)&&inM(e.date)),'a');

function vSum(){
 const cu=sum(M(S.c)),sf=SITES.map(x=>[x,getSiteIn(x)]),zd=sum(M(S.z)),kh=sum(M(S.x)),tp=sum(M(S.p).filter(x=>!x.ded));
 const out=sf.reduce((t,r)=>t+r[1],0)+zd+kh+tp,rest=cu-out,R=(l,v)=>`<div class="row"><span>${l}</span><b>${f(v)}</b></div>`;
 return`<div class="card"><div class="mu">إجمالي الواصل من العهدة</div><div class="big">${f(cu)}</div></div>
 <div class="card"><h3>📤 المصروف من العهدة</h3>${sf.map(r=>R('الواصل لموقع '+r[0],r[1])).join('')}${R('الواصل لزيد السوق',zd)}${R('إجمالي الخوارج (نثريات)',kh)}${R('إجمالي التصفيات',tp)}<div class="row"><b>إجمالي المصروف</b><b>${f(out)}</b></div></div>
 <div class="card"><div class="mu">العهدة المتبقية (الواصل − المصروف)</div><div class="big ${cls(rest)}">${f(rest)}</div></div>
 <div class="card"><div class="row"><span id="cst2">${cloudLabel()}</span><button class="s" onclick="syncSetup()">☁️ المزامنة</button></div></div><div class="g2"><button onclick="exportXlsx()">📥 تصدير Excel</button><button class="s" onclick="$('#xf').click()">📤 استيراد Excel</button></div><input type="file" id="xf" accept=".xlsx" style="display:none" onchange="impX(this)">
 <div class="g2" style="margin-top:8px"><button class="s" onclick="bk()">نسخ البيانات</button><button class="s" onclick="rs()">استرجاع نسخة</button></div>`}
function debtCard(){const m={};S.m.forEach(x=>m[x.name]=(m[x.name]||0)+(+x.amount||0));const r=Object.entries(m).filter(e=>Math.abs(e[1])>0.001);
 return`<div class="card"><h3>📒 المتبقي على كل شخص (كل الشهور)</h3>${r.map(e=>`<div class="row"><span>${esc(e[0])}</span><b class="${cls(-e[1])}">${f(e[1])}</b></div>`).join('')||'<div class="mu">لا توجد مديونيات</div>'}<div class="row"><b>الإجمالي</b><b>${f(sum(S.m))}</b></div></div><p class="mu">بتتخصم تلقائي من مستحقات الشخص لما تضغط "تصفية" في صفحته.</p>`}
function setSub(t,k){sub[t]=k;render()}
const chips=(a,cur,t)=>'<div class="chips">'+a.map(k=>`<button class="${k==cur?'':'s'}" onclick="setSub('${t}','${k}')">${L[k].t}</button>`).join('')+'</div>';
function vL(k){const c=L[k],l=(k=='m'?S[k]:M(S[k])).sort((a,b)=>b.date.localeCompare(a.date));
 return`<div class="card">${c.f.map(([key,lb,ty,op])=>ty=='select'?`<select id="f_${key}">${(op=='SITES'?[...SITES,'أخرى']:op).map(o=>`<option>${o}</option>`).join('')}</select>`:`<input id="f_${key}" type="${ty=='list'?'text':ty}" ${ty=='list'?'list="wl"':''} placeholder="${lb}" value="${ty=='date'?today():''}" ${ty=='number'?'inputmode="decimal"':''}>`).join('')}
 <datalist id="wl">${S.w.map(w=>`<option>${esc(w.n)}</option>`).join('')}</datalist><button onclick="addL('${k}')">إضافة</button></div>
 ${k=='m'?debtCard():''}<input id="q_${k}" placeholder="🔍 بحث بالاسم أو التاريخ أو الملاحظة (في كل الشهور)" oninput="$('#lst').innerHTML=ledList('${k}',this.value)"><div id="lst">${ledList(k,'')}</div>`}
function ledList(k,q){const c=L[k];q=(q||'').trim().toLowerCase();let l=k=='m'||q?S[k]:M(S[k]);
 if(q)l=l.filter(x=>[x.name,x.s,x.n,x.date,x.d,x.r,x.k,x.amount].some(v=>String(v??'').toLowerCase().includes(q)));l=[...l].sort((a,b)=>b.date.localeCompare(a.date));
 return`<div class="card"><div class="row b"><span>${q?'نتائج البحث (كل الشهور) — '+l.length:'إجمالي '+c.t}</span><span>${f(sum(k=='p'?l.filter(x=>!x.ded):l))}</span></div>${l.map(x=>`<div class="row"><div><div class="b">${c.s(x)}</div><div class="mu">${x.date}</div></div><div style="display:flex;gap:4px"><button class="edit" onclick="editL('${k}','${x.id}')">تعديل</button><button class="g" onclick="del('${k}','${x.id}')">حذف</button></div></div>`).join('')||'<div class="mu">لا توجد نتائج</div>'}</div>`}
function addL(k){const o={id:uid()};L[k].f.forEach(x=>o[x[0]]=$('#f_'+x[0]).value);if(!+o.amount)return;o.amount=+o.amount;S[k].push(o);save();render()}
async function editL(k,id){const x0=S[k].find(i=>i.id==id);if(!x0)return;
 const r=await formDlg('تعديل — '+L[k].t,L[k].f.map(([key,lb,ty,op])=>({k:key,l:lb,t:ty=='list'?'text':ty=='select'?undefined:ty,o:ty=='select'?[...new Set([x0[key],...(op=='SITES'?[...SITES,'أخرى']:op)])]:undefined,v:x0[key]})));
 const x=S[k].find(i=>i.id==id);if(r&&x){Object.assign(x,r);save();render()}}
function toggleSel(id){selW.has(id)?selW.delete(id):selW.add(id);render()}
function selectAll(){S.w.filter(w=>w.s==site).forEach(w=>selW.add(w.id));render()}
function clearSel(){selW.clear();render()}
function printSelected(){if(!S.w.some(w=>selW.has(w.id))){say('اختار عامل واحد على الأقل');return}multiPrint=true;render();scrollTo(0,0)}
function vMultiPrint(){const ws=S.w.filter(w=>selW.has(w.id));
 return`<div class="noprint"><button class="s" onclick="multiPrint=false;render()">→ رجوع</button> <button onclick="pdfStmts([...selW])">📄 PDF (${ws.length})</button> <button class="s" onclick="doPrint()">🖨️ طباعة</button></div><p class="mu noprint">${ws.length} كشف تحت بعض — شهر ${mon=='all'?'كل الشهور':mon}</p>`+ws.map(w=>stmtHtml(stmtModel(w))).join('')}
function vWork(){
 if(openStmt)return vStmt(S.w.find(w=>w.id==openStmt));if(openW)return vW(S.w.find(w=>w.id==openW));if(multiPrint)return vMultiPrint();
 const ws=S.w.filter(w=>w.s==site),fin=getSiteIn(site),se=getSiteOut(site),we=getWX(site),wa=getWA(site),net=fin-se-we-wa;
 const tx=[...S.sf.filter(x=>x.site==site&&inM(x.date)).map(x=>({...x,ty:'in'})),...S.se.filter(x=>x.site==site&&inM(x.date)).map(x=>({...x,ty:'out'}))].sort((a,b)=>b.date.localeCompare(a.date));
 return`<div class="chips">${SITES.map(s=>`<button class="${s==site?'':'s'}" onclick="site='${s}';render()">${s}</button>`).join('')}<button class="s" onclick="addSiteName()">＋ موقع جديد</button></div>
 <div class="noprint" style="display:flex;gap:6px;margin-bottom:8px"><button class="s" onclick="renameSite()">✏️ تغيير اسم الموقع</button><button class="g" onclick="delSite()">حذف الموقع</button></div>
 <div class="card" style="border:2px solid var(--pr)"><h3>💼 مقارنة الواصل بالمصروف</h3><div class="row"><span>الواصل للموقع</span><b class="ok">${f(fin)}</b></div><div class="row"><span>مصاريف الموقع</span><b class="bad">-${f(se)}</b></div><div class="row"><span>مصاريف العمال</span><b class="bad">-${f(we)}</b></div><div class="row"><span>سلف العمال</span><b class="bad">-${f(wa)}</b></div><div class="row"><b>العهدة المتبقية بالموقع</b><b class="big ${cls(net)}">${f(net)}</b></div></div>
 ${siteBlock('sf','الواصل للموقع')}
 ${siteBlock('se','مصاريف الموقع')}
 <div class="card noprint"><h3>➕ عامل جديد</h3><input id="n" placeholder="اسم العامل"><input id="jb" placeholder="الوظيفة"><select id="ty" onchange="$('#meterFields').style.display=this.value=='meter'?'block':'none'"><option value="daily">باليومية</option><option value="meter">بالمتر</option></select><div class="g2"><input type="number" id="rt" placeholder="سعر اليومية" inputmode="decimal"><input type="number" id="ot" placeholder="سعر السهرة" inputmode="decimal"></div><div id="meterFields" style="display:none"><div class="g2"><input type="number" id="mr" placeholder="سعر المتر" inputmode="decimal"><input type="number" id="hr" placeholder="يومية المساعد" inputmode="decimal"></div></div><h3>📅 رصيد الشهر السابق</h3><div class="g2"><input type="number" id="pd" placeholder="أيام" inputmode="decimal"><input type="number" id="po" placeholder="سهرات" inputmode="decimal"><input type="number" id="pe" placeholder="مصاريف" inputmode="decimal"><input type="number" id="pm" placeholder="متر" inputmode="decimal"><input type="number" id="pa" placeholder="سلف" inputmode="decimal"></div><button onclick="addW()">إضافة عامل</button></div>
 <div class="card"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;padding-bottom:8px;border-bottom:2px solid var(--ln)" class="noprint"><b>عمال الموقع (${ws.length})</b><div style="display:flex;gap:4px"><button class="s" onclick="selectAll()">الكل</button>${selW.size?`<button class="s" onclick="clearSel()">إلغاء (${selW.size})</button>`:''}<button onclick="printSelected()">📋 كشوف المختارين</button></div></div>
 ${ws.length?ws.map(w=>{const s=wst(w);return`<div class="row"><input type="checkbox" ${selW.has(w.id)?'checked':''} onchange="toggleSel('${w.id}')"><div style="flex:1;cursor:pointer" onclick="openW='${w.id}';render()"><div class="b">${esc(w.n)}</div><div class="mu">${esc(w.jb)} · ${w.ty=='daily'?'يومية '+f(w.rt):'متر '+f(w.meterRate)}</div></div><b class="${cls(s.bal)}" onclick="openW='${w.id}';render()">${f(s.bal)}</b></div>`}).join(''):'<div class="mu">لا يوجد عمال</div>'}</div>`}
function siteBlock(k,title){const l=(k=='sf'?S.sf:S.se).filter(x=>x.site==site&&inM(x.date)).sort((a,b)=>b.date.localeCompare(a.date)),ty=k=='sf'?'in':'out';
 return`<div class="card noprint"><h3>➕ ${title} (${site})</h3><input id="sd_${k}" type="date" value="${today()}"><input type="number" id="sa_${k}" placeholder="المبلغ" inputmode="decimal"><input id="sn_${k}" placeholder="${k=='se'?'البند':'ملاحظة'}"><button onclick="addSite('${k}')">تسجيل</button></div>

 document.body.appendChild(o);MOD++;const i=o.querySelector('#dlgi'),done=v=>{o.remove();MOD--;res(v)};if(i){i.value=def??'';i.focus();i.select&&i.select();i.addEventListener('keydown',e=>{if(e.key=='Enter')done(i.value)})}

const FB_DEFAULT=null,AUTH_HOST='https://identitytoolkit.googleapis.com',TOKEN_HOST='https://securetoken.googleapis.com',COLS=['c','x','z','p','m','w','e','sf','se','ms'];
const LSG=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}},LSS=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let CFG=LSG('ohda_cfg',null)||FB_DEFAULT,AUTH=LSG('ohda_auth',null),SNAP=LSG('ohda_snap',{}),TOMB=LSG('ohda_tomb',{}),SEEN=LSG('ohda_seen',{}),DEV=LSG('ohda_dev',null);
if(!DEV){DEV=uid();LSS('ohda_dev',DEV)}
let sync='off',syncT=null,syncing=false,lastOk=0,lastErr='',tokenExp=0,idTok='',pendingRender=false;
const hsh=t=>{let h=5381;for(let i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))|0;return (h>>>0).toString(36)+t.length};
const sigOf=r=>hsh(JSON.stringify(r,(k,v)=>k=='_u'?undefined:v));
function cfgDef(){return(!SNAP.cfg||!SNAP.cfg.sites)&&JSON.stringify(SITES)==JSON.stringify(['العاصمة','أكتوبر','السوق'])}
const getC=k=>k=='cfg'?(cfgDef()?[]:[{id:'sites',list:SITES.slice(),_u:S.sitesU||0}]):S[k];
const norm=(k,r)=>{if(k=='ms'){r.items=r.items||[];r.deds=r.deds||[]}if(k=='w')r.prev=r.prev||{days:0,ot:0,exp:0,meterQty:0,adv:0}};
function pendingN(){let n=0;for(const k of [...COLS,'cfg']){SNAP[k]=SNAP[k]||{};const ids=new Set();for(const r of getC(k)){ids.add(r.id);if(SNAP[k][r.id]!==sigOf(r))n++}for(const id of Object.keys(SNAP[k]))if(!ids.has(id))n++}return n}
function stamp(){const now=Date.now(),up={};
 for(const k of [...COLS,'cfg']){SNAP[k]=SNAP[k]||{};const ids=new Set();
  for(const r of getC(k)){ids.add(r.id);if(SNAP[k][r.id]!==sigOf(r)){if(k=='cfg')S.sitesU=now;else r._u=now;(up[k]=up[k]||[]).push(k=='cfg'?{...r,_u:now}:r)}}
  for(const id of Object.keys(SNAP[k]))if(!ids.has(id)){TOMB[k]=TOMB[k]||{};if(!TOMB[k][id])TOMB[k][id]=now}}
 return up}
const persistSync=()=>{LSS('ohda_snap',SNAP);LSS('ohda_tomb',TOMB)};
function cloudLabel(){if(!CFG||!AUTH)return'📱 محفوظ على الجهاز فقط — اضغط لتفعيل المزامنة';

 if(sync=='auth')return'🔑 سجّل الدخول من جديد (اضغط هنا)';if(sync=='err')return'⚠️ خطأ في المزامنة — اضغط للتفاصيل';
 return p?`⏳ ${p} تغيير لسه هيترفع…`:'✅ متزامن'+(lastOk?' '+new Date(lastOk).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'}):'')}

async function authCall(mode,email,pw){const r=await fetch(`${AUTH_HOST}/v1/accounts:${mode=='new'?'signUp':'signInWithPassword'}?key=${CFG.key}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:pw,returnSecureToken:true})}),j=await r.json();

async function token(){if(idTok&&tokenExp-Date.now()>60000)return idTok;
 const r=await fetch(`${TOKEN_HOST}/v1/token?key=${CFG.key}`,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(AUTH.refresh)}),j=await r.json();

async function dbq(path,method='GET',body){const t=await token(),r=await fetch(`${CFG.db.replace(/\/$/,'')}/ohda/${AUTH.uid}${path}.json?auth=${t}`,{method,body:body===undefined?undefined:JSON.stringify(body)});

async function pullAll(){const d=(await dbq(''))||{};let ch=false;
 for(const k of COLS){const rem=d[k]||{};S[k]=S[k]||[];const idx=new Map(S[k].map(r=>[r.id,r]));SNAP[k]=SNAP[k]||{};
  for(const id of Object.keys(rem)){const r=rem[id],l=idx.get(id);if(!r)continue;
   if(r._d){if(l&&(l._u||0)<=r._u){S[k]=S[k].filter(x=>x.id!=id);idx.delete(id);ch=true}if(!l||(l._u||0)<=r._u)delete SNAP[k][id];continue}
   if(!l||(r._u||0)>(l._u||0)){const n={...r,id};norm(k,n);if(l)S[k][S[k].indexOf(l)]=n;else S[k].push(n);SNAP[k][id]=sigOf(n);ch=true}}}
 const rs=d.cfg&&d.cfg.sites;if(rs&&(rs._u||0)>(S.sitesU||0)&&rs.list){SITES.splice(0,SITES.length,...rs.list);S.sitesU=rs._u;SNAP.cfg={sites:sigOf({id:'sites',list:SITES.slice()})};ch=true}
 return ch}
async function pushPending(){const up=stamp();let n=0;
 for(const k of [...COLS,'cfg']){const recs=up[k]||[],tb=TOMB[k]||{},body={};recs.forEach(r=>body[r.id]=r);Object.keys(tb).forEach(id=>body[id]={_d:1,_u:tb[id]});const ids=Object.keys(body);
  for(let i=0;i<ids.length;i+=300){const part={};ids.slice(i,i+300).forEach(id=>part[id]=body[id]);await dbq('/'+k,'PATCH',part)}
  recs.forEach(r=>{SNAP[k][r.id]=sigOf(r)});Object.keys(tb).forEach(id=>{delete SNAP[k][id];delete tb[id]});n+=ids.length}

async function syncNow(quiet){if(!CFG||!AUTH||syncing)return;syncing=true;if(!quiet){sync='sync';stat()}
 try{stamp();const m=(await dbq('/_meta'))||{},other=Object.keys(m).filter(k=>k!=DEV).sort().map(k=>k+':'+m[k]).join(',');
  if(other!==SEEN.o||!SEEN.init){const ch=await pullAll();SEEN.o=other;SEEN.init=1;LSS('ohda_seen',SEEN);if(ch){LSS('ohda2',S);persistSync();softRender()}}
  await pushPending();sync='ok';lastOk=Date.now();lastErr=''}
 catch(e){lastErr=String(e&&e.message||e);sync=(e instanceof TypeError)?'offline':(!AUTH?'auth':'err')}
 finally{syncing=false;stat()}}
